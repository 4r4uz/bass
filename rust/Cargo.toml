[package]
name = "rust_lib_bass"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
symphonia = { version = "0.5.4", features = [
  "mp3",
  "flac",
  "wav",
  "ogg",
  "vorbis",
  "aac",
  "isomp4",
  "alac",
] }

[dev-dependencies]
hound = "3.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
