name: bass
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^12.1.3
  hive: ^2.2.3
  just_audio: ^0.10.6
  mime: ^2.1.0

  rust_lib_bass:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  
  haudiotagger: ^1.2.6
  path_provider: ^2.1.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#12131A"
  adaptive_icon_foreground: "assets/app_icon.png"